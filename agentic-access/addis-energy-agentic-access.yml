out_of_scope:
  detail: >-
    The write half of the wp/v2 routes, the contact-form-7 feedback endpoint, the
    siteground-optimizer, code-snippets, duplicator and wp-abilities namespaces, and
    /wp/v2/settings are all administrator-only site-operations surfaces. They are deliberately
    excluded from openapi/ and no agent contract is recommended for them: they are not a public
    API and an agent should never attempt them.
