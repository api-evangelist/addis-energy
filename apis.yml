aid: addis-energy
name: Addis Energy
description: >-
  Addis Energy is a Somerville, Massachusetts deep-tech energy company founded in January 2025 out
  of research in the MIT Department of Materials Science and Engineering. It is developing
  Stimulated Geologic Ammonia — injecting nitrogen, water and engineered fluids into iron-rich
  subsurface rock and using the earth's own heat and pressure as the reactor to produce ammonia
  underground rather than in a Haber-Bosch plant. Founded by Michael Alexander (CEO), Charlie
  Mitchell (COO), Iwnetim Abate (Chief Science Officer) and Yet-Ming Chiang (Chief Strategy
  Officer), it has raised an $8.3M seed round plus a $4.5M ARPA-E award, backed by Engine Ventures,
  At One Ventures, Pillar VC, Voyager VC, Blindspot Ventures and Emerson Collective. It is not a
  software vendor: no developer program, portal, SDKs or product API. The only machine-readable
  interface it exposes is the WordPress core REST content API behind addisenergy.com, captured here
  for discovery and anonymously readable but read-only.
