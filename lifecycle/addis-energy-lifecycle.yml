  authored_by: WordPress core (upstream), not Addis Energy
  policy_published: false
  policy_url: null
  detail: >-
    wp/v2 has been the stable WordPress REST namespace since WordPress 4.7 (2016). A future wp/v3
    would be introduced by upstream WordPress, not by Addis Energy, and this site would inherit it
    on a plugin/core update with no announcement to any consumer.
