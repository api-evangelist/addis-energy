description: >-
  Lifecycle posture of the WordPress REST surface behind addisenergy.com. Addis Energy makes no
  API commitments of any kind — there is no versioning policy, no deprecation policy, no SLA and
  no status page. The versioning that exists is inherited from WordPress core, not authored by the
  company. NO StatusPage and NO Deprecation pointer is wired in apis.yml, because neither exists.
versioning:
